<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIBLE — Pantalla Pública</title>
  <link rel="icon" type="image/png" href="../shared/assets/bible-logo.png">
  <link rel="stylesheet" href="css/projection.css">
</head>

<body>
  <div class="projection-container">
    <!-- Capa de Fondo Dinámico -->
    <div id="bgAmbientLayer" class="projection-background-ambient" style="display: none;"></div>
    <div id="bgLayer" class="projection-background"></div>
    <video id="bgVideoLayer" class="projection-background-video" loop muted playsinline style="display: none;"></video>
    <div id="bgScrim" class="projection-scrim"></div>

    <!-- Capa de Contenido -->
    <main id="contentLayer" class="projection-content">
      <div id="refTop" class="projection-reference pos-top" style="display: none;"></div>
      <div id="mainText" class="projection-text"></div>
      <div id="refBottom" class="projection-reference pos-bottom" style="display: none;"></div>
    </main>

    <!-- Capa de Diapositiva del Predicador (Fiel al 100% con Colores, Fondos y Gráficos Originales) -->
    <div id="slideLayer" class="projection-slide-layer" style="display: none;">
      <img id="slideImg" class="projection-slide-img" alt="Diapositiva del Predicador">
    </div>

    <!-- Capa de Spots Multimedia (Videos e Imágenes 4K) -->
    <div id="mediaSpotLayer" class="projection-media-spot-layer" style="display: none;">
      <video id="spotVideo" class="projection-spot-video" playsinline style="display: none;"></video>
      <iframe id="spotYoutube" class="projection-spot-youtube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="display: none; width: 100%; height: 100%; border: none;"></iframe>
      <img id="spotImage" class="projection-spot-image" alt="Spot Multimedia" style="display: none;">
    </div>

    <!-- Capa de Ruleta Dinámica en Vivo (Pantalla Gigante 4K) -->
    <div id="rouletteLayer" class="projection-roulette-layer" style="display: none;">
      <div class="projection-roulette-header">
        <div class="projection-roulette-tag">ACTIVIDAD EN VIVO</div>
        <h2 id="projRouletteTitle" class="projection-roulette-title">Ruleta Dinámica</h2>
      </div>

      <div class="projection-wheel-container">
        <div class="projection-wheel-pointer"></div>
        <canvas id="projectionRouletteCanvas" width="900" height="900"></canvas>
        <div class="projection-wheel-center-hub">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" style="color: #38BDF8;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
      </div>

      <!-- Banner de Ganador y Celebración -->
      <div id="projWinnerBanner" class="projection-winner-banner" style="display: none;">
        <span class="proj-winner-badge">¡RESULTADO GANADOR!</span>
        <span id="projWinnerLabel" class="proj-winner-name">—</span>
      </div>

      <!-- Canvas de Confeti -->
      <canvas id="projConfettiCanvas" class="projection-confetti-canvas"></canvas>
    </div>

    <!-- Capa de Logotipo Institucional -->
    <div id="logoLayer" class="projection-logo-layer">
      <img id="churchLogoImg" class="projection-logo-img" alt="Logo de la Iglesia" style="display: none;">
      <h1 id="churchNameTitle" class="projection-church-title" style="display: none;"></h1>
    </div>

    <!-- Capa de Pantalla a Negro (Blackout) -->
    <div id="blackoutLayer" class="projection-blackout-layer"></div>
  </div>

  <script type="module" src="js/projection.js"></script>
</body>

</html>
