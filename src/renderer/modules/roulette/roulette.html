<div class="roulette-workspace">
  <!-- Barra Superior -->
  <header class="roulette-header-bar">
    <div class="roulette-header-title">
      <div class="roulette-badge-tag">ACTIVIDADES Y DINÁMICAS</div>
      <h2>Ruleta Dinámica de Sorteos</h2>
      <span>Dinámicas bíblicas, concursos de jóvenes, niños y actividades pro-templo (Ctrl+R)</span>
    </div>

    <div class="roulette-top-actions">
      <button id="btnCreateNewList" class="btn">
        <svg class="icon icon-sm" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5v14"/>
        </svg>
        <span>Nueva Lista</span>
      </button>
      <button id="btnSpinRouletteMaster" class="btn btn-primary btn-spin-master">
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <path d="m4.93 4.93 4.24 4.24M14.83 14.83l4.24 4.24M14.83 9.17l4.24-4.24M4.93 19.07l4.24-4.24M2 12h6M16 12h6M12 2v6M12 16v6"/>
        </svg>
        <span>GIRAR RULETA (Espacio)</span>
      </button>
    </div>
  </header>

  <!-- Malla Principal -->
  <div class="roulette-main-grid">
    <!-- Columna Izquierda: Listas y Elementos -->
    <div class="roulette-sidebar-card">
      <div class="lists-selector-box">
        <label class="form-label" for="selectRouletteList">Lista de Participantes Activa:</label>
        <select id="selectRouletteList" class="input-text">
          <!-- Opciones dinámicas -->
        </select>
      </div>

      <div class="items-manager-box">
        <span class="form-label">Agregar Elemento o Nombre:</span>
        <div class="add-item-form">
          <input type="text" id="inputNewItemLabel" class="input-text" placeholder="Ej: Hno. Carlos, Pregunta #1..." style="font-size: 13px;">
          <button id="btnAddItem" class="btn btn-primary" style="padding: 6px 12px;">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5v14"/>
            </svg>
          </button>
        </div>

        <div id="rouletteItemsList" class="items-tag-list">
          <!-- Lista dinámica de elementos con opción de eliminar -->
        </div>

        <div class="items-footer-row">
          <span id="itemsCounterLabel" class="items-counter-text">0 elementos</span>
          <button id="btnDeleteCurrentList" class="btn btn-sm btn-danger" title="Eliminar lista">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
            <span>Eliminar Lista</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Canvas de la Ruleta -->
    <div class="roulette-stage-card">
      <div class="wheel-canvas-container">
        <div class="wheel-pointer"></div>
        <canvas id="rouletteCanvas" width="800" height="800"></canvas>
        <div id="btnCenterHub" class="wheel-center-hub">GIRAR</div>
      </div>

      <!-- Anuncio de Ganador -->
      <div id="winnerBanner" class="winner-banner" style="display: none;">
        <span class="winner-banner-title">¡Resultado Seleccionado!</span>
        <span id="winnerLabelText" class="winner-banner-name">—</span>
      </div>
    </div>
  </div>
</div>
