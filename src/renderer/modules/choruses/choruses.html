<div class="choruses-workspace">
  <!-- Barra Superior: Modo Espontáneo -->
  <header class="choruses-search-bar">
    <div class="spontaneous-input-wrapper">
      <span class="spontaneous-icon">⚡</span>
      <input 
        type="text" 
        id="spontaneousSearchInput" 
        class="spontaneous-input" 
        placeholder="Modo Espontáneo: Escribe título o fragmento de la letra... (Enter para proyectar)"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
    <button id="btnOpenNewChorusModal" class="btn btn-primary">
      + Nuevo Corito
    </button>
  </header>

  <!-- Malla Principal (Sidebar de Resultados y Visor de Diapositivas) -->
  <div class="choruses-main-grid">
    <!-- Columna Izquierda: Resultados y Biblioteca -->
    <div class="choruses-sidebar-card">
      <div class="category-filter-tabs">
        <button id="tabCatAll" class="category-tab-btn active" data-cat="">Todos</button>
        <button id="tabCatPentecostal" class="category-tab-btn" data-cat="1">Pentecostales</button>
        <button id="tabCatWorship" class="category-tab-btn" data-cat="2">Adoración</button>
        <button id="tabCatPlaylists" class="category-tab-btn" data-cat="playlist">📋 Repertorio</button>
      </div>

      <div id="chorusesListContainer" class="chorus-results-list">
        <!-- Renderizado dinámico de tarjetas de coritos -->
      </div>
    </div>

    <!-- Columna Derecha: Diapositivas del Corito Seleccionado -->
    <div class="chorus-detail-card">
      <div class="detail-header">
        <div class="detail-title-box">
          <h3 id="detailChorusTitle">Selecciona un corito</h3>
          <span id="detailChorusCategory">Biblioteca de alabanzas</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btnAddToRepertoire" class="btn" style="font-size: 11px;">
            + Agregar a Lista
          </button>
          <button id="btnEditCurrentChorus" class="btn" style="font-size: 11px;">
            ✏️ Editar
          </button>
          <button id="btnDeleteCurrentChorus" class="btn" style="font-size: 11px; color: var(--status-blackout); border-color: rgba(239, 68, 68, 0.3);">
            🗑️
          </button>
          <button id="btnProjectActiveSlide" class="btn btn-primary" style="font-weight: 600;">
            🖥️ Proyectar Diapositiva (Enter)
          </button>
        </div>
      </div>

      <!-- Cuadrícula de Diapositivas -->
      <div id="slidesGridContainer" class="slides-grid-container">
        <!-- Renderizado dinámico de diapositivas -->
      </div>
    </div>
  </div>

  <!-- Modal para Crear / Editar Corito -->
  <div id="chorusEditorModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="card-title">
        <span id="modalChorusTitle">Registrar Nuevo Corito</span>
        <button id="btnCloseChorusModal" class="btn" style="padding: 2px 6px;">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="editChorusTitleInput">Título del Corito:</label>
        <input type="text" id="editChorusTitleInput" class="input-text" placeholder="Ej: Alabaré a mi Señor" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="editChorusCategorySelect">Categoría:</label>
        <select id="editChorusCategorySelect" class="input-text">
          <option value="1">Coritos Pentecostales</option>
          <option value="2">Coros de Adoración</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="editChorusLyricsTextarea">
          Letra (Separa las estrofas con doble salto de línea para crear diapositivas):
        </label>
        <textarea 
          id="editChorusLyricsTextarea" 
          class="input-text" 
          rows="8" 
          placeholder="Escribe aquí la letra completa del corito..."
          style="resize: vertical; font-family: inherit; font-size: 13px;"
          required
        ></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
        <button id="btnCancelEditChorus" class="btn">Cancelar</button>
        <button id="btnSaveChorus" class="btn btn-primary">Guardar Corito</button>
      </div>
    </div>
  </div>
</div>
