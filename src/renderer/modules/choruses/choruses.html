<div class="choruses-workspace">
  <!-- Barra Superior: Modo Espontáneo -->
  <header class="choruses-search-bar">
    <div class="spontaneous-input-wrapper">
      <svg class="icon spontaneous-icon" viewBox="0 0 24 24">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <input 
        type="text" 
        id="spontaneousSearchInput" 
        class="spontaneous-input" 
        placeholder="Búsqueda espontánea: Escribe una palabra o título... (Enter para proyectar directo)"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
    <button id="btnOpenNewChorusModal" class="btn btn-primary">
      <svg class="icon icon-sm" viewBox="0 0 24 24">
        <path d="M5 12h14M12 5v14"/>
      </svg>
      <span>Nuevo Corito</span>
    </button>
  </header>

  <!-- Malla Principal (Sidebar de Resultados y Visor de Diapositivas) -->
  <div class="choruses-main-grid">
    <!-- Columna Izquierda: Resultados y Biblioteca -->
    <div class="choruses-sidebar-card">
      <div class="category-filter-tabs">
        <button id="tabCatAll" class="category-tab-btn active" data-cat="">Todos</button>
        <button id="tabCatPentecostal" class="category-tab-btn" data-cat="1">Pentecostales</button>
        <button id="tabCatWorship" class="category-tab-btn" data-cat="2">Adoración</button>
        <button id="tabCatPlaylists" class="category-tab-btn" data-cat="playlist">
          <svg class="icon icon-sm" viewBox="0 0 24 24">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
          </svg>
          <span>Repertorio</span>
        </button>
      </div>

      <div id="chorusesListContainer" class="chorus-results-list">
        <!-- Renderizado dinámico de tarjetas de coritos -->
      </div>
    </div>

    <!-- Columna Derecha: Diapositivas del Corito Seleccionado -->
    <div class="chorus-detail-card">
      <div class="detail-header">
        <div class="detail-title-box">
          <h3 id="detailChorusTitle">Selecciona un corito</h3>
          <span id="detailChorusCategory">Biblioteca de alabanzas pentecostales y adoración</span>
        </div>
        <div class="detail-actions-box">
          <button id="btnAddToRepertoire" class="btn btn-sm">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Al Repertorio</span>
          </button>
          <button id="btnEditCurrentChorus" class="btn btn-sm" title="Editar corito">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            </svg>
            <span>Editar</span>
          </button>
          <button id="btnDeleteCurrentChorus" class="btn btn-sm btn-danger" title="Eliminar corito">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
          </button>
          <button id="btnProjectActiveSlide" class="btn btn-primary btn-project-chorus">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <rect width="20" height="14" x="2" y="3" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            <span>Proyectar Diapositiva (Enter)</span>
          </button>
        </div>
      </div>

      <!-- Cuadrícula de Diapositivas -->
      <div id="slidesGridContainer" class="slides-grid-container">
        <!-- Renderizado dinámico de diapositivas -->
      </div>
    </div>
  </div>

  <!-- Modal para Crear / Editar Corito -->
  <div id="chorusEditorModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modalChorusTitle" class="modal-title">Registrar Nuevo Corito</span>
        <button id="btnCloseChorusModal" class="btn btn-sm" style="padding: 4px 8px;">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="editChorusTitleInput">Título de la Alabanza / Corito:</label>
        <input type="text" id="editChorusTitleInput" class="input-text" placeholder="Ej: Alabaré a mi Señor" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="editChorusCategorySelect">Categoría:</label>
        <select id="editChorusCategorySelect" class="input-text">
          <option value="1">Coritos Pentecostales (Fuego)</option>
          <option value="2">Coros de Adoración</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="editChorusLyricsTextarea">
          Letra (Separa las estrofas con doble salto de línea para generar diapositivas automáticamente):
        </label>
        <textarea 
          id="editChorusLyricsTextarea" 
          class="input-text" 
          rows="8" 
          placeholder="Escribe la letra completa aquí...&#10;&#10;Ejemplo:&#10;Alabaré, alabaré, alabaré a mi Señor.&#10;&#10;Juan vio el número de los redimidos,&#10;y todos alababan al Señor."
          style="resize: vertical; font-family: inherit; font-size: 13px; line-height: 1.5;"
          required
        ></textarea>
      </div>

      <div class="modal-footer">
        <button id="btnCancelEditChorus" class="btn">Cancelar</button>
        <button id="btnSaveChorus" class="btn btn-primary">
          <svg class="icon icon-sm" viewBox="0 0 24 24">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span>Guardar Corito</span>
        </button>
      </div>
    </div>
  </div>
</div>
