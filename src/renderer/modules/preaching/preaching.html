<div class="preaching-workspace">
  <!-- Barra Superior -->
  <header class="preaching-header-bar">
    <div class="preaching-info-title">
      <div class="preaching-badge-tag">SERMONES Y BOSQUEJOS</div>
      <h2 id="currentPreachingTitle">Presentación de Predicación</h2>
      <span id="currentPreachingMeta">Sermones, bosquejos y presentaciones para culto</span>
    </div>

    <div class="preaching-top-actions">
      <!-- Botón de Alternancia Rápida a la Biblia (Tecla Maestra Ctrl+T) -->
      <button id="btnSwitchToBible" class="bible-switch-pill" title="Abre la Biblia sin interrumpir la diapositiva del predicador (Ctrl+T)">
        <svg class="icon icon-sm" viewBox="0 0 24 24">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
          <path d="M6 6h10M6 10h10"/>
        </svg>
        <span>Alternar con Biblia</span>
        <kbd>Ctrl+T</kbd>
      </button>

      <button id="btnImportPresentation" class="btn btn-primary" title="Importar presentación fiel con todas sus imágenes, fondos y colores (PDF, PowerPoint o Imágenes)">
        <svg class="icon icon-sm" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" x2="12" y1="3" y2="15"/>
        </svg>
        <span>Importar Presentación (PDF / PPTX)</span>
      </button>
    </div>
  </header>

  <!-- Malla Principal -->
  <div class="preaching-main-grid">
    <!-- Columna Izquierda: Lista de Presentaciones Importadas -->
    <div class="preaching-sidebar-card">
      <div class="column-header">
        <div class="column-title">
          <svg class="icon icon-sm" viewBox="0 0 24 24">
            <rect width="20" height="14" x="2" y="3" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
          <span id="preachingCountHeader">Biblioteca de Sermones</span>
        </div>
      </div>

      <!-- Buscador de sermones -->
      <div class="books-filter-input-row preaching-filter-row" style="padding: 8px 12px; border-bottom: 1px solid var(--border-subtle);">
        <svg class="icon icon-xs" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input 
          type="text" 
          id="inputPreachingSearch" 
          class="book-filter-input" 
          placeholder="Buscar sermón o predicador..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button id="btnClearPreachingSearch" class="btn-clear-mini" title="Limpiar búsqueda" style="display: none;">✕</button>
      </div>

      <div id="presentationsListContainer" class="presentations-list">
        <!-- Renderizado dinámico de presentaciones -->
      </div>
    </div>

    <!-- Columna Derecha: Diapositivas de la Presentación -->
    <div class="presentation-viewer-card">
      <div class="viewer-controls-bar">
        <div class="viewer-nav-group">
          <button id="btnPrevSlide" class="btn btn-sm" title="Diapositiva anterior (← / ↑)">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="m15 18-6-6 6-6"/>
            </svg>
            <span>Anterior</span>
          </button>
          <button id="btnNextSlide" class="btn btn-sm" title="Siguiente diapositiva (→ / ↓ / Espacio)">
            <span>Siguiente</span>
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
          <span id="slideIndicatorBadge" class="slide-indicator-badge">
            Diapositiva 1 de 4
          </span>
        </div>

        <!-- Grupo de Modo: Mantener Original vs Fondo del Culto (Requerimiento Clave) -->
        <div class="render-mode-toggle-group" title="Modo de Fondo y Fidelidad Visual">
          <button id="btnModeOriginal" class="btn btn-sm btn-mode-toggle active" title="Proyectar fielmente la diapositiva original del predicador con sus imágenes, fondos y colores tal cual">
            <span>🖼️ Mantener Original</span>
          </button>
          <button id="btnModeChurchBg" class="btn btn-sm btn-mode-toggle" title="Proyectar el texto sobre el fondo dinámico del culto">
            <span>🎨 Fondo del Culto</span>
          </button>
        </div>

        <div class="viewer-action-group">
          <button id="btnResumePreaching" class="btn btn-sm btn-resume" title="Reanudar exactamente en la diapositiva donde se quedó el predicador (Ctrl+T)">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>Retomar Predicación</span>
          </button>
          <button id="btnDeletePreaching" class="btn btn-sm btn-danger" title="Eliminar presentación">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
          </button>
          <button id="btnProjectSlideDirect" class="btn btn-primary btn-project-slide" title="Proyectar de inmediato a la pantalla pública (Enter)">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <rect width="20" height="14" x="2" y="3" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            <span>Proyectar Diapositiva (Enter)</span>
          </button>
        </div>
      </div>

      <!-- Cuadrícula de Diapositivas con Miniaturas Reales -->
      <div id="deckSlidesContainer" class="viewer-slides-grid">
        <!-- Renderizado dinámico de diapositivas con imágenes reales del predicador -->
      </div>
    </div>
  </div>

  <!-- BARRA INFERIOR DE CONFIGURACIÓN Y EMISIÓN (Usa clases estándar de components.css) -->
  <footer class="toolbar-config preaching-bottom-bar">
    <div class="config-group preaching-customizers">
      <!-- Indicador Tally de Emisión en Vivo -->
      <div class="live-status-chip live-status-pill" id="liveStatusBadgePreaching" title="Estado actual de emisión hacia la pantalla pública">
        <span class="live-dot live-status-dot"></span>
        <span class="live-status-text">
          <span class="live-status-tag">EN AIRE:</span>
          <span id="liveStatusPreachingRef" class="live-status-cite">En espera</span>
        </span>
      </div>

      <span class="config-divider toolbar-divider"></span>

      <!-- Selector de Fondo General (POO Reutilizable - Mismo fondo del culto) -->
      <button id="btnOpenPreachingBgPicker" class="config-pill btn-bg-selector" title="Cambiar fondo de proyección (Alt+B)">
        <span id="activePreachingBgThumb" class="config-pill-thumb bg-thumb-preview"></span>
        <span class="config-pill-text bg-selector-text">
          <span class="config-pill-label bg-selector-label">Fondo</span>
          <span id="activePreachingBgName" class="config-pill-name bg-selector-name">Negro Clásico</span>
        </span>
      </button>

      <span class="config-divider toolbar-divider"></span>

      <!-- Alternar Color de Letra (Blanco / Negro) -->
      <div class="config-toggle-group text-color-toggle-group" title="Color de letra para modo Fondo del Culto (Alt+C)">
        <button id="btnPreachingTextWhite" class="config-toggle-btn btn-color-choice active" title="Letras blancas (Alt+C)">
          <span class="color-dot dot-white"></span>
          <span>Blanco</span>
        </button>
        <button id="btnPreachingTextBlack" class="config-toggle-btn btn-color-choice" title="Letras negras para fondos claros (Alt+C)">
          <span class="color-dot dot-black"></span>
          <span>Negro</span>
        </button>
      </div>

      <span class="config-divider toolbar-divider"></span>

      <!-- Selector de Tipografía / Tipo de Letra -->
      <select id="selectPreachingFontFamily" class="config-select config-select-font" title="Tipo de Letra para proyección">
        <option value="sans-serif" selected>Moderna Sans</option>
        <option value="serif">Clásica Bíblica</option>
        <option value="bold">Impacto Bold</option>
        <option value="condensed">Condensada</option>
      </select>

      <!-- Tamaño de Letra (A- / A+) -->
      <div class="font-size-stepper-group" title="Tamaño de letra en la proyección">
        <button id="btnPreachingFontDec" class="btn-font-step btn-font-dec" title="Disminuir tamaño de letra (A-)">A-</button>
        <span id="preachingFontSizeBadge" class="font-size-badge">100%</span>
        <button id="btnPreachingFontInc" class="btn-font-step btn-font-inc" title="Aumentar tamaño de letra (A+)">A+</button>
      </div>

      <span class="config-divider toolbar-divider"></span>

      <!-- Mayúsculas -->
      <label class="config-checkbox customizer-checkbox-label" title="Texto de la predicación en mayúsculas (Alt+M)">
        <input type="checkbox" id="checkPreachingUppercase">
        <span>MAYÚS</span>
      </label>
    </div>

    <div class="config-actions-right preaching-actions-right">
      <div class="nav-button-cluster">
        <button id="btnBottomPrevPreaching" class="btn-nav" title="Diapositiva anterior (← / ↑)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          <span>Anterior</span>
        </button>
        <button id="btnBottomNextPreaching" class="btn-nav" title="Siguiente diapositiva (→ / ↓ / Espacio)">
          <span>Siguiente</span>
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <button id="btnBottomProjectPreaching" class="btn btn-primary btn-project-main" title="Proyectar diapositiva seleccionada (Enter)">
        <svg class="icon icon-sm" viewBox="0 0 24 24">
          <rect width="20" height="14" x="2" y="3" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <span>Proyectar</span>
        <kbd class="kbd-badge">Enter</kbd>
      </button>
    </div>
  </footer>
</div>
