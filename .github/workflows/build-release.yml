name: Build and Release BIBLE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows & Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Install build tools (7-zip)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full

      - name: Build Windows Portable and Executable Installer
        run: |
          bash scripts/build-windows-portable.sh
          bash scripts/build-windows-exe-installer.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/main/services/downloads/BIBLE-Instalador-Windows.exe
            src/main/services/downloads/BIBLE-Windows-Portable.zip
            src/main/services/downloads/bible-control.apk
            src/main/services/downloads/bible-desktop-linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

